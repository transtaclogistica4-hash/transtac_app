<!DOCTYPE html>
<!-- TRANSTAC MULTAS | build v9-2026-08-17 | pagina=lista -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0c">
<title>Multas · TRANSTAC</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="multas.css?v=10">
</head>
<body>
<div id="splash">
  <img class="splash-logo" src="logo-transtac.png" alt="TRANSTAC TRANSPORTES">
  <div class="splash-bar"><i></i></div>
  <div class="splash-txt">Carregando</div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove();},6000);</script>
<header></header>

<main>
  <nav class="subnav" id="subnav"></nav>

  <div class="card" style="margin-top:16px">
    <div class="row">
      <div class="field lg" style="flex:2 1 260px">
        <label>Buscar</label>
        <input id="fq" placeholder="AIT, placa, motorista, infração, local…">
      </div>
      <div class="field sm">
        <label>Status</label>
        <select id="fstatus"><option value="">Todos</option></select>
      </div>
      <div class="field sm">
        <label>Órgão</label>
        <select id="forgao"><option value="">Todos</option></select>
      </div>
      <div class="field sm">
        <label>Infração de</label>
        <input type="date" id="fde">
      </div>
      <div class="field sm">
        <label>Até</label>
        <input type="date" id="fate">
      </div>
      <div class="field sm" style="flex:0 0 auto">
        <label>&nbsp;</label>
        <button class="ghost-btn" id="btnLimparF">Limpar</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="status" id="resumo">Carregando…</div>
    <div class="row" style="gap:8px">
      <button class="ghost-btn" id="btnCsv">Exportar CSV</button>
      <button class="reload" id="btnReload">Atualizar</button>
      <a class="save-btn" href="multas-cadastro.html" style="text-decoration:none;display:inline-block">+ Nova multa</a>
    </div>
  </div>

  <div class="table-wrap">
    <table class="data">
      <thead>
        <tr>
          <th>AIT</th><th>Placa</th><th>Motorista</th><th>Órgão</th>
          <th>Infração</th><th>Data</th><th>Gravidade</th>
          <th class="num">Valor</th><th>Vencimento</th><th>Status</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="vazio" style="display:none">Nenhuma multa encontrada com esses filtros.</div>
  </div>
</main>

<!-- modal de edicao -->
<div class="modal-backdrop" id="modal">
  <div class="modal">
    <h3 id="mTitulo">Editar multa</h3>
    <p class="modal-sub" id="mSub"></p>
    <div class="row">
      <div class="field"><label>AIT</label><input id="e_ait"></div>
      <div class="field sm"><label>Renainf</label><input id="e_renainf"></div>
      <div class="field sm"><label>Placa</label><input id="e_placa" style="text-transform:uppercase"></div>
      <div class="field"><label>Motorista</label><input id="e_motorista"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field sm"><label>Órgão</label><select id="e_orgao"></select></div>
      <div class="field sm"><label>Data infração</label><input type="date" id="e_dataInfracao"></div>
      <div class="field sm"><label>Hora</label><input id="e_horaInfracao" placeholder="00:00"></div>
      <div class="field sm"><label>Código</label><input id="e_codigoInfracao"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field lg"><label>Descrição da infração</label><input id="e_descricaoInfracao"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field lg" style="flex:2 1 300px"><label>Local</label><input id="e_local"></div>
      <div class="field sm"><label>Município</label><input id="e_municipio"></div>
      <div class="field sm" style="flex:0 0 90px"><label>UF</label><input id="e_uf" maxlength="2" style="text-transform:uppercase"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field sm"><label>Gravidade</label><select id="e_gravidade"></select></div>
      <div class="field sm" style="flex:0 0 110px"><label>Pontos</label><input type="number" id="e_pontos" min="0"></div>
      <div class="field sm"><label>Valor (R$)</label><input type="number" step="0.01" id="e_valor"></div>
      <div class="field sm"><label>Vencimento</label><input type="date" id="e_vencimento"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field sm"><label>Status</label><select id="e_status"></select></div>
      <div class="field sm"><label>Indicação</label><select id="e_statusIndicacao"></select></div>
      <div class="field sm"><label>Prazo indicação</label><input type="date" id="e_prazoIndicacao"></div>
      <div class="field sm"><label>Data pagamento</label><input type="date" id="e_dataPagamento"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Responsável</label><input id="e_responsavel"></div>
      <div class="field lg"><label>Observações</label><textarea id="e_observacoes"></textarea></div>
    </div>
    <div class="meta" id="e_anexo"></div>
    <div class="modal-actions">
      <button class="ghost-btn" id="mExcluir" style="margin-right:auto;color:var(--danger);border-color:rgba(248,113,113,.5)">Excluir</button>
      <button class="ghost-btn" id="mCancelar">Cancelar</button>
      <button class="save-btn" id="mSalvar">Salvar alterações</button>
    </div>
  </div>
</div>

<script src="multas-app.js?v=10"></script>
<script>
montarHeader('MULTAS', 'Todas as autuações registradas.', 'multas.html');
montarSubnav('multas-lista.html');

let dados = [], atual = null;

STATUS.forEach(s => fstatus.add(new Option(s.label, s.v)));
ORGAOS.forEach(o => forgao.add(new Option(o, o)));
ORGAOS.forEach(o => e_orgao.add(new Option(o, o)));
e_orgao.add(new Option('', ''), 0);
GRAVIDADES.forEach(g => e_gravidade.add(new Option(GRAV_LABEL[g], g)));
e_gravidade.add(new Option('', ''), 0);
STATUS.forEach(s => e_status.add(new Option(s.label, s.v)));
STATUS_INDICACAO.forEach(s => e_statusIndicacao.add(new Option(s.label, s.v)));

async function carregar() {
  document.getElementById('resumo').textContent = 'Carregando…';
  try { dados = await api('listar'); } catch (e) { toast('Erro: ' + e.message); dados = []; }
  render();
}

function filtros() {
  return { q: fq.value, status: fstatus.value, orgao: forgao.value, de: fde.value, ate: fate.value };
}

function render() {
  const lista = aplicarFiltros(dados, filtros())
    .sort((a, b) => (toDate(b.dataInfracao) || 0) - (toDate(a.dataInfracao) || 0));
  const total = lista.reduce((s, m) => s + numero(m.valor), 0);
  document.getElementById('resumo').textContent =
    lista.length + ' de ' + dados.length + ' multa(s) · ' + brl(total);
  document.getElementById('vazio').style.display = lista.length ? 'none' : 'block';

  document.getElementById('tbody').innerHTML = lista.map(m =>
    '<tr>' +
    '<td class="mono">' + esc(m.ait || '—') + '</td>' +
    '<td class="mono"><b>' + esc(m.placa || '—') + '</b></td>' +
    '<td>' + esc(m.motorista || '—') + '</td>' +
    '<td>' + esc(m.orgao || '—') + '</td>' +
    '<td>' + esc((m.codigoInfracao ? m.codigoInfracao + ' · ' : '') + (m.descricaoInfracao || '—')).slice(0, 90) + '</td>' +
    '<td class="mono">' + br(m.dataInfracao) + '</td>' +
    '<td>' + badgeGravidade(m.gravidade) + '</td>' +
    '<td class="num">' + brl(numero(m.valor)) + '</td>' +
    '<td class="mono">' + br(m.vencimento) + '</td>' +
    '<td>' + badgeStatus(m) + '</td>' +
    '<td class="center"><button class="linkish" style="background:none;border:none;cursor:pointer" data-id="' + esc(m.id) + '">Editar</button></td>' +
    '</tr>'
  ).join('');

  $$('#tbody [data-id]').forEach(b => b.onclick = () => abrir(b.dataset.id));
}

function abrir(id) {
  atual = dados.find(m => String(m.id) === String(id));
  if (!atual) return;
  mTitulo.textContent = 'Multa ' + (atual.ait || atual.id);
  mSub.textContent = (atual.placa || '') + ' · ' + br(atual.dataInfracao) + ' · ' + (atual.orgao || 'órgão não informado');
  ['ait','renainf','placa','motorista','orgao','horaInfracao','codigoInfracao','descricaoInfracao',
   'local','municipio','uf','gravidade','pontos','valor','status','statusIndicacao','responsavel','observacoes']
    .forEach(k => { const el = document.getElementById('e_' + k); if (el) el.value = atual[k] == null ? '' : atual[k]; });
  ['dataInfracao','vencimento','prazoIndicacao','dataPagamento']
    .forEach(k => document.getElementById('e_' + k).value = iso(atual[k]));
  e_anexo.innerHTML = atual.anexoUrl
    ? 'Anexo: <a class="linkish" target="_blank" rel="noopener" href="' + esc(atual.anexoUrl) + '">' + esc(atual.anexoNome || 'abrir documento') + '</a>'
    : (atual.anexoNome ? 'Anexo: ' + esc(atual.anexoNome) : 'Sem anexo.');
  modal.classList.add('show');
}

mCancelar.onclick = () => modal.classList.remove('show');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('show'); };

mSalvar.onclick = async () => {
  const item = { id: atual.id };
  ['ait','renainf','placa','motorista','orgao','dataInfracao','horaInfracao','codigoInfracao',
   'descricaoInfracao','local','municipio','uf','gravidade','pontos','valor','vencimento',
   'prazoIndicacao','statusIndicacao','status','responsavel','dataPagamento','observacoes']
    .forEach(k => { const el = document.getElementById('e_' + k); if (el) item[k] = el.value; });
  item.placa = (item.placa || '').toUpperCase();
  item.uf = (item.uf || '').toUpperCase();
  item.valor = numero(item.valor);
  mSalvar.disabled = true;
  try {
    await api('salvar', { itens: [item] });
    modal.classList.remove('show');
    toast('Multa atualizada.');
    await carregar();
  } catch (e) { toast('Erro: ' + e.message, 5000); }
  finally { mSalvar.disabled = false; }
};

mExcluir.onclick = async () => {
  if (!confirm('Excluir definitivamente a multa ' + (atual.ait || atual.id) + '?')) return;
  try {
    await api('excluir', { id: atual.id });
    modal.classList.remove('show');
    toast('Multa excluída.');
    await carregar();
  } catch (e) { toast('Erro: ' + e.message, 5000); }
};

[fq, fstatus, forgao, fde, fate].forEach(el => el.addEventListener('input', render));
btnLimparF.onclick = () => { fq.value = ''; fstatus.value = ''; forgao.value = ''; fde.value = ''; fate.value = ''; render(); };
btnReload.onclick = carregar;
btnCsv.onclick = () => exportarCSV(aplicarFiltros(dados, filtros()), 'multas-transtac');

carregar();
</script>
</body>
</html>
