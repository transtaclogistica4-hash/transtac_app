<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0c">
<title>Dashboard de Multas · TRANSTAC</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="multas.css?v=10">
<style>

  .bar-row.two{
    grid-template-columns:minmax(80px,auto) minmax(40px,1fr) auto auto;
    column-gap:10px;align-items:center;
  }
  .bar-row.two .bar-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-row .bar-money{
    text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
    color:var(--accent);font-weight:600;font-size:12.5px;
  }
  .bar-row.two .bar-val{text-align:right;white-space:nowrap;}
  @media (max-width:720px){
    .bar-row.two{column-gap:8px;}
    .bar-row .bar-money{font-size:11.5px;}
  }
</style>
</head>
<body>
<div id="splash">
  <img class="splash-logo" src="logo-transtac.png" alt="TRANSTAC TRANSPORTES">
  <div class="splash-bar"><i></i></div>
  <div class="splash-txt">Carregando</div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove();},6000);</script>
<header></header>

<main>
  <nav class="subnav" id="subnav"></nav>

  <div class="toolbar">
    <div class="status" id="resumo">Carregando…</div>
    <div class="row" style="gap:8px">
      <div class="field sm"><input type="date" id="fde" title="Infração de"></div>
      <div class="field sm"><input type="date" id="fate" title="Infração até"></div>
      <button class="ghost-btn" id="btn12m">Últimos 12 meses</button>
      <button class="reload" id="btnReload">Atualizar</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="chart-grid">
    <div class="card">
      <div class="route-name">Multas por mês</div>
      <div id="chMes"></div>
    </div>
    <div class="card">
      <div class="route-name">Situação da carteira</div>
      <div id="chStatus"></div>
    </div>
    <div class="card">
      <div class="route-name">Top motoristas (valor)</div>
      <div id="chMotorista"></div>
    </div>
    <div class="card">
      <div class="route-name">Top veículos (quantidade)</div>
      <div id="chPlaca"></div>
    </div>
    <div class="card">
      <div class="route-name">Órgão autuador</div>
      <div id="chOrgao"></div>
    </div>
    <div class="card">
      <div class="route-name">Infrações mais frequentes</div>
      <div id="chInfracao"></div>
    </div>
  </div>

  <div class="section-title">Vencendo nos próximos 15 dias</div>
  <div class="table-wrap">
    <table class="data">
      <thead><tr><th>AIT</th><th>Placa</th><th>Motorista</th><th>Infração</th><th class="num">Valor</th><th>Vencimento</th><th>Prazo</th></tr></thead>
      <tbody id="tbVenc"></tbody>
    </table>
    <div class="empty" id="vazioVenc" style="display:none">Nenhum vencimento nos próximos 15 dias.</div>
  </div>
</main>

<script src="multas-app.js?v=10"></script>
<script>
montarHeader('DASHBOARD DE MULTAS', 'Indicadores da carteira de autuações.', 'multas.html');
montarSubnav('multas-dashboard.html');

let dados = [];

async function carregar() {
  try { dados = await api('listar'); } catch (e) { toast('Erro: ' + e.message); dados = []; }
  render();
}

function barras(mapa, formato, limite, extra, extraFmt) {
  const itens = Object.entries(mapa).sort((a, b) => b[1] - a[1]).slice(0, limite || 8);
  if (!itens.length) return '<div class="empty" style="padding:14px">Sem dados no período.</div>';
  const max = Math.max.apply(null, itens.map(i => i[1])) || 1;
  return itens.map(([k, v]) => {
    let col = '';
    if (extra) {
      const e = extra[k] || 0;
      col = '<div class="bar-money">' + (extraFmt === 'num' ? e : brl(e)) + '</div>';
    }
    return '<div class="bar-row' + (extra ? ' two' : '') + '">' +
      '<div class="bar-label" title="' + esc(k) + '">' + esc(k) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(2, (v / max) * 100) + '%"></div></div>' +
      col +
      '<div class="bar-val">' + (formato === 'brl' ? brl(v) : v) + '</div></div>';
  }).join('');
}

function render() {
  const lista = aplicarFiltros(dados, { de: fde.value, ate: fate.value });
  const totalGeral = lista.reduce((s, m) => s + numero(m.valor), 0);
  const pagas = lista.filter(m => m.status === 'PAGA');
  
  const aPagar = lista.filter(m => m.status !== 'PAGA' && m.status !== 'CANCELADA');
  const vencidas = aPagar.filter(m => { const d = diasAte(m.vencimento); return d !== null && d < 0; });
  
  const semValor = lista.filter(m => !numero(m.valor)).length;
  const pontos = lista.filter(m => m.statusIndicacao !== 'ACEITA').reduce((s, m) => s + numero(m.pontos), 0);
  const ticket = lista.length ? totalGeral / lista.length : 0;

  document.getElementById('resumo').textContent =
    lista.length + ' multa(s) no período · ' + brl(totalGeral);

  document.getElementById('kpis').innerHTML = [
    ['accent', 'Total de multas', lista.length, 'ticket médio ' + brl(ticket)],
    ['warn', 'Valor a pagar', brl(aPagar.reduce((s, m) => s + numero(m.valor), 0)),
      aPagar.length + ' em aberto' + (semValor ? ' · ' + semValor + ' sem valor' : '')],
    ['ok', 'Já pago', brl(pagas.reduce((s, m) => s + numero(m.valor), 0)), pagas.length + ' quitada(s)'],
    ['danger', 'Vencidas', vencidas.length, brl(vencidas.reduce((s, m) => s + numero(m.valor), 0)) + ' em atraso'],
    ['accent', 'Pontos na empresa', pontos, 'não transferidos ao condutor']
  ].map(([c, l, v, s]) =>
    '<div class="kpi ' + c + '"><div class="kpi-label">' + l + '</div><div class="kpi-value">' + v + '</div><div class="kpi-sub">' + s + '</div></div>'
  ).join('');

  const porMes = {}, porStatus = {}, porMot = {}, porPlaca = {}, porOrgao = {}, porInfr = {};
  
  const vlrMes = {}, vlrStatus = {}, vlrPlaca = {}, vlrOrgao = {}, vlrInfr = {}, qtdMot = {};
  const MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  lista.forEach(m => {
    const vl = numero(m.valor);
    const d = toDate(m.dataInfracao);
    if (d) {
      const k = MES[d.getMonth()] + '/' + String(d.getFullYear()).slice(2);
      porMes[k] = (porMes[k] || 0) + 1;
      vlrMes[k] = (vlrMes[k] || 0) + vl;
    }
    const st = statusInfo(m.status).label;
    porStatus[st] = (porStatus[st] || 0) + 1;
    vlrStatus[st] = (vlrStatus[st] || 0) + vl;
    const mot = m.motorista || 'Não indicado';
    porMot[mot] = (porMot[mot] || 0) + vl;
    qtdMot[mot] = (qtdMot[mot] || 0) + 1;
    if (m.placa) {
      porPlaca[m.placa] = (porPlaca[m.placa] || 0) + 1;
      vlrPlaca[m.placa] = (vlrPlaca[m.placa] || 0) + vl;
    }
    const org = m.orgao || 'Não informado';
    porOrgao[org] = (porOrgao[org] || 0) + 1;
    vlrOrgao[org] = (vlrOrgao[org] || 0) + vl;
    const inf = (m.descricaoInfracao || m.codigoInfracao || 'Não informada').slice(0, 42);
    porInfr[inf] = (porInfr[inf] || 0) + 1;
    vlrInfr[inf] = (vlrInfr[inf] || 0) + vl;
  });

  const mesOrd = {};
  Object.keys(porMes).sort((a, b) => {
    const pa = a.split('/'), pb = b.split('/');
    return (+pa[1] - +pb[1]) || (MES.indexOf(pa[0]) - MES.indexOf(pb[0]));
  }).forEach(k => mesOrd[k] = porMes[k]);

  chMes.innerHTML = barras(mesOrd, null, 12, vlrMes);
  chStatus.innerHTML = barras(porStatus, null, 8, vlrStatus);
  
  chMotorista.innerHTML = barras(porMot, 'brl', 8, qtdMot, 'num');
  chPlaca.innerHTML = barras(porPlaca, null, 8, vlrPlaca);
  chOrgao.innerHTML = barras(porOrgao, null, 8, vlrOrgao);
  chInfracao.innerHTML = barras(porInfr, null, 8, vlrInfr);

  const venc = lista.filter(m => {
    if (['PAGA', 'CANCELADA'].includes(m.status)) return false;
    const d = diasAte(m.vencimento);
    return d !== null && d <= 15;
  }).sort((a, b) => (toDate(a.vencimento) || 0) - (toDate(b.vencimento) || 0));

  document.getElementById('vazioVenc').style.display = venc.length ? 'none' : 'block';
  document.getElementById('tbVenc').innerHTML = venc.map(m =>
    '<tr><td class="mono">' + esc(m.ait || '—') + '</td>' +
    '<td class="mono"><b>' + esc(m.placa || '—') + '</b></td>' +
    '<td>' + esc(m.motorista || '—') + '</td>' +
    '<td>' + esc(m.descricaoInfracao || '—').slice(0, 60) + '</td>' +
    '<td class="num">' + brl(numero(m.valor)) + '</td>' +
    '<td class="mono">' + br(m.vencimento) + '</td>' +
    '<td>' + pillPrazo(m.vencimento) + '</td></tr>'
  ).join('');
}

btn12m.onclick = () => {
  const a = new Date(); const d = new Date(a.getFullYear() - 1, a.getMonth(), a.getDate());
  fde.value = iso(d); fate.value = iso(a); render();
};
[fde, fate].forEach(el => el.addEventListener('input', render));
btnReload.onclick = carregar;
carregar();
</script>
</body>
</html>
